<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1140" viewBox="0 0 2200 1140" role="img" aria-labelledby="title description">
  <title id="title">시스템 소프트웨어 아키텍처</title>
  <desc id="description">Application 스케줄러가 사용자 드라이버와 변수, UART 및 SysTick을 사용하고 각 드라이버가 ST HAL 함수를 호출하는 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#425775"/>
    </marker>
    <style>
      .group { fill: #f8fafc; stroke: #dce4ef; stroke-width: 2; }
      .node { fill: #fff; stroke: #aab8cf; stroke-width: 2; }
      .group-title { fill: #263b58; font: 600 22px 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
      .group-subtitle { fill: #64748b; font: 15px 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
      .node-title { fill: #243855; font: 600 20px 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
      .node-detail { fill: #52647e; font: 18px 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
      .code { fill: #243855; font: 18px 'DejaVu Sans Mono', Consolas, monospace; }
      .edge { fill: none; stroke: #425775; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { fill: #52647e; font: 17px 'DejaVu Sans Mono', Consolas, monospace; }
    </style>
  </defs>

  <rect width="2200" height="1140" fill="#fff"/>

  <!-- Group backgrounds are drawn before the connections and nodes. -->
  <rect class="group" x="40" y="400" width="440" height="540" rx="14"/>
  <text class="group-title" x="70" y="438">Application</text>
  <text class="group-subtitle" x="220" y="438">main.c USER CODE</text>

  <rect class="group" x="750" y="45" width="460" height="690" rx="14"/>
  <text class="group-title" x="780" y="83">사용자 드라이버</text>

  <rect class="group" x="1495" y="45" width="665" height="1045" rx="14"/>
  <text class="group-title" x="1525" y="83">ST HAL</text>
  <text class="group-subtitle" x="1620" y="83">Drivers/</text>

  <!-- Each connection is one straight segment from one node border to another. -->
  <g aria-label="연결">
    <line class="edge" x1="430" y1="480" x2="805" y2="160"/>
    <line class="edge" x1="430" y1="515" x2="805" y2="400"/>
    <line class="edge" x1="430" y1="550" x2="805" y2="640"/>
    <line class="edge" x1="257.5" y1="640" x2="257.5" y2="780"/>
    <line class="edge" x1="1165" y1="160" x2="1535" y2="160"/>
    <line class="edge" x1="1165" y1="400" x2="1535" y2="400"/>
    <line class="edge" x1="1165" y1="415" x2="1535" y2="555"/>
    <line class="edge" x1="1165" y1="640" x2="1535" y2="595"/>
    <line class="edge" x1="430" y1="620" x2="1535" y2="860"/>
    <line class="edge" x1="430" y1="630" x2="1535" y2="1010"/>
  </g>
  <text class="edge-label" x="1240" y="772">printf → __io_putchar</text>

  <g aria-label="Application">
    <rect class="node" x="85" y="460" width="345" height="180" rx="9"/>
    <text class="node-title" x="110" y="510">while(1) 스케줄러</text>
    <text class="node-detail" x="110" y="548">HAL_GetTick() 기반</text>

    <rect class="node" x="85" y="780" width="345" height="125" rx="9"/>
    <text class="code" x="110" y="818">static float</text>
    <text class="code" x="110" y="848">illuminance / temperature</text>
    <text class="code" x="110" y="878">pressure / altitude</text>
  </g>

  <g aria-label="사용자 드라이버">
    <rect class="node" x="805" y="110" width="360" height="100" rx="9"/>
    <text class="code" x="830" y="151">BH1750_Init</text>
    <text class="code" x="830" y="181">BH1750_ReadLux</text>

    <rect class="node" x="805" y="350" width="360" height="100" rx="9"/>
    <text class="code" x="830" y="385">BMP280_Init / ReadData</text>
    <text class="node-detail" x="830" y="418">보정식, 고도식</text>

    <rect class="node" x="805" y="590" width="360" height="100" rx="9"/>
    <text class="code" x="830" y="625">TM1637_Init / DisplayDecimal</text>
    <text class="code" x="830" y="655">DisplayString</text>
  </g>

  <g aria-label="ST HAL">
    <rect class="node" x="1535" y="110" width="585" height="100" rx="9"/>
    <text class="code" x="1560" y="151">HAL_I2C_Master_Transmit / Receive</text>
    <text class="code" x="1560" y="181">HAL_I2C_IsDeviceReady</text>

    <rect class="node" x="1535" y="350" width="585" height="100" rx="9"/>
    <text class="code" x="1560" y="407">HAL_SPI_Transmit / Receive</text>

    <rect class="node" x="1535" y="525" width="585" height="100" rx="9"/>
    <text class="code" x="1560" y="582">HAL_GPIO_WritePin / ReadPin</text>

    <rect class="node" x="1535" y="810" width="585" height="100" rx="9"/>
    <text class="code" x="1560" y="867">HAL_UART_Transmit</text>

    <rect class="node" x="1535" y="960" width="585" height="100" rx="9"/>
    <text class="code" x="1560" y="1001">HAL_GetTick</text>
    <text class="node-detail" x="1560" y="1031">SysTick 1 ms</text>
  </g>
</svg>
